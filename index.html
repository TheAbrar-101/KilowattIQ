<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>KilowattIQ</title>
    <meta name="description" content="IoT-enabled Smart Energy Monitoring and Cost Analysis System for Bangladeshi households" />
    <meta property="og:title" content="KilowattIQ" />
    <meta property="og:description" content="IoT-enabled Smart Energy Monitoring and Cost Analysis System for Bangladeshi households" />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#020617" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KilowattIQ" />
    <meta name="application-name" content="KilowattIQ" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />

    <!-- Suppress harmless Vite HMR WebSocket connection notices in preview iframe -->
    <script>
      (function() {
        var isViteWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg && msg.message ? msg.message : msg);
          return s.indexOf('WebSocket') !== -1 || s.indexOf('ws:') !== -1 || (s.indexOf('vite') !== -1 && s.indexOf('connect') !== -1);
        };
        window.addEventListener('error', function(e) {
          if (isViteWsError(e.message) || isViteWsError(e.filename) || isViteWsError(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason && (e.reason.message || e.reason);
          if (isViteWsError(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>

    <!-- Zero White Flash Immediate Theme Setup -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('kilowattiq_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && systemDark) || (stored === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else if (stored === 'light' || (stored === 'system' && !systemDark)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            // Default dark mode (slate-950)
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-amber-400 selection:text-slate-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

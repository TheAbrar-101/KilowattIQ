    <!-- Suppress harmless Vite HMR WebSocket connection notices in preview iframe -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = urlStr.indexOf('token=') !== -1 || urlStr.indexOf('vite-hmr') !== -1 || protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var handlers = {};
              return {
                url: urlStr,
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (!handlers[type]) handlers[type] = [];
                  handlers[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { listener(new Event('open')); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (handlers[type]) {
                    handlers[type] = handlers[type].filter(function(l) { return l !== listener; });
                  }
                },
                dispatchEvent: function(event) {
                  var list = handlers[event.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i](event); } catch(e) {}
                  }
                  return true;
                }
              };
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var isViteWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg && msg.message ? msg.message : msg);
          return s.indexOf('WebSocket') !== -1 || s.indexOf('ws:') !== -1 || (s.indexOf('vite') !== -1 && s.indexOf('connect') !== -1);
        };
        window.addEventListener('error', function(e) {
          if (isViteWsError(e.message) || isViteWsError(e.filename) || isViteWsError(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason && (e.reason.message || e.reason);
          if (isViteWsError(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsError(arguments[i])) return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>

    <!-- Zero White Flash Immediate Theme Setup -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('kilowattiq_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && systemDark) || (stored === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else if (stored === 'light' || (stored === 'system' && !systemDark)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            // Default dark mode (slate-950)
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-amber-400 selection:text-slate-950 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
